<!DOCTYPE html>
<html>
<head>
    <title>Nested List Example</title>
</head>
<body>
    <h2>Mixed Nested List Example</h2>

    <ol>
        <li>Fruits
            <ul>
                <li>Apple</li>
                <li>Banana</li>
                <li>Mango</li>
            </ul>
        </li>

        <li>Animals
            <ul>
                <li>Dog</li>
                <li>Cat</li>
                <li>Rabbit</li>
            </ul>
        </li>

        <li>Colors
            <ol type="a">
                <li>Red</li>
                <li>Blue</li>
                <li>Green</li>
            </ol>
        </li>
    </ol>
</body>
</html>
